name: OpenDMOfw

on:
  push:
    paths:
      - 'OpenDMOfw/**'
      - '.github/workflows/opendmofw.yml'
  pull_request:
    paths:
      - 'OpenDMOfw/**'
      - '.github/workflows/opendmofw.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          # libnewlib is needed explicitly for --specs=nano.specs; relying on
          # apt Recommends is how this breaks on a --no-install-recommends runner.
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build OP104 and OP57
        working-directory: OpenDMOfw
        run: make && make MODEL=OP57
      - name: Host tests
        working-directory: OpenDMOfw
        run: make test
      - name: Worst-case stack depth
        working-directory: OpenDMOfw
        run: make stack && make stack MODEL=OP57
      - name: Install Renode
        run: |
          curl -sSL -o renode.tar.gz https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz
          mkdir -p "$HOME/renode" && tar xzf renode.tar.gz -C "$HOME/renode" --strip-components=1
      - name: Firmware image in Renode (boot, LED, SysTick, head shift)
        working-directory: OpenDMOfw
        run: make renode RENODE="$HOME/renode/renode" && make renode MODEL=OP57 RENODE="$HOME/renode/renode"

  pc-patch:
    # net48 + WinForms, so this half only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build the patcher
        working-directory: OpenDMOfw/pc-patch/src
        run: dotnet build -c Release
      - name: Patcher tests
        working-directory: OpenDMOfw/pc-patch/test
        run: dotnet run -c Release
